---
name: Build Devcontainer

on:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # https://github.com/actions/checkout/releases/tag/v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # https://github.com/docker/setup-buildx-action/releases/tag/v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # https://github.com/docker/login-action/releases/tag/v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6  # https://github.com/devcontainers/ci/releases/tag/v0.3.1900000417
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          noCache: ${{ github.event_name == 'workflow_dispatch' }}
          push: always
          configFile: .devcontainer/Ubuntu/devcontainer.json

  test:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Run using the runner user.
      options: --user=1001

    steps:
      - name: Check asdf availability
        run: |
          gh --version
        shell: bash -ieo pipefail {0}
